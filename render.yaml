services:
  - type: worker
    name: amazon-price-watch
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -u amazon_price_watch.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
